                    <input
                        type="text"
                        id="kelas"
                        placeholder="Contoh: XI RPL 1"

                </div>

                <div class="form-group">
                    <label>Jurusan</label>
                    <input
                        type="text"
                        id="jurusan"

<script>

const API_URL = '/api/siswa';
// ========================================
// INTEGRASI FRONTEND DENGAN REST API
// Menggunakan JavaScript Fetch API
// ========================================

// =====================================
// TAMPILKAN PESAN
// =====================================

function showMessage(message, type) {

    const messageBox = document.getElementById('message');

    messageBox.textContent = message;

    messageBox.className = 'message ' + type;

    messageBox.style.display = 'block';

    setTimeout(() => {

        messageBox.style.display = 'none';

    }, 3000);
}


// =====================================
// LOADING
// =====================================

function showLoading(status) {

    document.getElementById('loading').style.display =
        status ? 'block' : 'none';

}


// =====================================
// GET DATA SISWA
// =====================================

async function getStudents() {

    showLoading(true);

    try {

        const response = await fetch(API_URL);

        const result = await response.json();

        if (!response.ok) {

            throw new Error(result.message);

        }

        displayStudents(result.data);

    } catch (error) {

        console.error(error);

        showMessage(
            'Gagal mengambil data siswa',
            'error'
        );

    } finally {

        showLoading(false);

    }
}


// =====================================
// TAMPILKAN DATA KE TABLE
// =====================================

function displayStudents(students) {

    const table = document.getElementById('studentTable');

    table.innerHTML = '';

    if (students.length === 0) {

        table.innerHTML = `
            <tr>
                <td colspan="7" class="empty">
                    Belum ada data siswa
                </td>
            </tr>
        `;

        return;
    }


    students.forEach(student => {

        const row = document.createElement('tr');

        row.innerHTML = `

            <td>${student.id}</td>

            <td>${student.nis}</td>

            <td>${student.nama}</td>

            <td>${student.kelas}</td>

            <td>${student.jurusan}</td>

            <td>${student.alamat}</td>

            <td>

                <button
                    class="btn-edit"
                    onclick='editStudent(${JSON.stringify(student)})'>
                    Edit
                </button>

                <button
                    class="btn-delete"
                    onclick="deleteStudent(${student.id})">
                    Hapus
                </button>

            </td>

        `;

        table.appendChild(row);

    });

}


// =====================================
// TAMBAH / EDIT SISWA
// =====================================

document
    .getElementById('studentForm')
    .addEventListener('submit', async function(event) {

        event.preventDefault();

        const id = document.getElementById('studentId').value;

        const data = {

            nis: document.getElementById('nis').value,

            nama: document.getElementById('nama').value,

            kelas: document.getElementById('kelas').value,

            jurusan: document.getElementById('jurusan').value,

            alamat: document.getElementById('alamat').value

        };


        try {

            let response;

            if (id) {

                // PUT

                response = await fetch(`${API_URL}/${id}`, {

                    method: 'PUT',

                    headers: {
                        'Content-Type': 'application/json'
                    },

                    body: JSON.stringify(data)

                });

            } else {

                // POST

                response = await fetch(API_URL, {

                    method: 'POST',

                    headers: {
                        'Content-Type': 'application/json'
                    },

                    body: JSON.stringify(data)

                });

            }


            const result = await response.json();


            if (!response.ok) {

                throw new Error(result.message);

            }


            showMessage(
                result.message,
                'success'
            );


            resetForm();

            getStudents();


        } catch (error) {

            console.error(error);

            showMessage(
                error.message || 'Terjadi kesalahan',
                'error'
            );

        }

    });


// =====================================
// EDIT SISWA
// =====================================

function editStudent(student) {

    document.getElementById('studentId').value =
        student.id;

    document.getElementById('nis').value =
        student.nis;

    document.getElementById('nama').value =
        student.nama;

    document.getElementById('kelas').value =
        student.kelas;

    document.getElementById('jurusan').value =
        student.jurusan;

    document.getElementById('alamat').value =
        student.alamat;


    document.getElementById('formTitle').textContent =
        'Edit Siswa';

    document.getElementById('submitButton').textContent =
        'Simpan Perubahan';

    document.getElementById('cancelButton').style.display =
        'inline-block';


    window.scrollTo({
        top: 0,
        behavior: 'smooth'
    });

}


// =====================================
// RESET FORM
// =====================================

function resetForm() {

    document.getElementById('studentForm').reset();

    document.getElementById('studentId').value = '';

    document.getElementById('formTitle').textContent =
        'Tambah Siswa';

    document.getElementById('submitButton').textContent =
        'Tambah Siswa';

    document.getElementById('cancelButton').style.display =
        'none';

}


// =====================================
// DELETE SISWA
// =====================================

async function deleteStudent(id) {

    const yakin = confirm(
        'Apakah kamu yakin ingin menghapus siswa ini?'
    );


    if (!yakin) {

        return;

    }


    try {

        const response = await fetch(
            `${API_URL}/${id}`,
            {
                method: 'DELETE'
            }
        );


        const result = await response.json();


        if (!response.ok) {

            throw new Error(result.message);

        }


        showMessage(
            result.message,
            'success'
        );


        getStudents();


    } catch (error) {

        console.error(error);

        showMessage(
            error.message || 'Gagal menghapus data',
            'error'
        );

    }

}


// =====================================
// JALANKAN SAAT HALAMAN DIBUKA
// =====================================

getStudents();

</script>
